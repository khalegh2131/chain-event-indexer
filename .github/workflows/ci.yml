name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: indexer
          POSTGRES_PASSWORD: indexer_password
          POSTGRES_DB: chain_event_indexer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indexer -d chain_event_indexer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      POLLER_ENABLED: 'false'
      LOG_LEVEL: silent
      # The service container exposes the test database on the job's localhost.
      DATABASE_URL: postgres://indexer:indexer_password@localhost:5432/chain_event_indexer_test
      TEST_DATABASE_URL: postgres://indexer:indexer_password@localhost:5432/chain_event_indexer_test
      ETH_RPC_URL: https://ethereum-rpc.publicnode.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Build the production Docker image
        run: docker build -t chain-event-indexer:ci .

      - name: Validate the compose files
        run: |
          docker compose -f docker-compose.test.yml config -q
          CONFIG_FILE=config/config.example.json docker compose config -q
